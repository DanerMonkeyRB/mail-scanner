<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mail Scanner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#3b82f6;--bg:#f2f4f7;--card:#fff;--text:#111827;--muted:#667085;--line:#e4e7ec;--green:#18864b}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
header{background:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:28px;line-height:1.1}
main{max-width:700px;margin:auto;padding:12px 14px calc(100px + env(safe-area-inset-bottom))}
.topButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 20px}
button{appearance:none;border:0;border-radius:14px;padding:14px 15px;font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
.primary{background:var(--blue);color:#fff}.secondary{background:#e9edf3;color:#182230}
.danger{background:#fee4e2;color:#b42318}
h2{font-size:18px;margin:18px 3px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #1018280b}
.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}
.icon{width:42px;height:42px;border-radius:13px;background:#eaf2ff;display:grid;place-items:center;font-size:21px;flex:none}
.name{font-weight:700;font-size:17px}.status{font-size:11px;font-weight:800;letter-spacing:.35px;margin-top:3px}.not{color:var(--muted)}.arrived{color:var(--green)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions button{width:100%}
.preview{width:100%;max-height:320px;object-fit:contain;background:#eef0f3;border-radius:14px;margin-top:12px}
textarea{width:100%;min-height:82px;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;resize:vertical}
.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.small{font-size:13px;color:var(--muted);line-height:1.4}
dialog{width:calc(100% - 28px);max-width:520px;border:0;border-radius:20px;padding:0;box-shadow:0 18px 70px #0005}
dialog::backdrop{background:#0006}.modal{padding:20px}.modal h2{margin:0 0 8px}
.fileButton{display:block;text-align:center;background:var(--blue);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:17px}
input[type=file]{display:none}
.close{margin-top:10px;width:100%}
@media(min-width:600px){main{padding-left:20px;padding-right:20px}.topButtons{grid-template-columns:180px 180px;justify-content:start}}
</style>
</head>
<body>
<header><h1>Mail Scanner</h1></header>
<main>
  <div class="topButtons">
    <button class="primary" id="addBtn">＋ Add Mail</button>
    <button class="secondary" id="digestBtn">Digest</button>
  </div>
  <h2>Today's Mail</h2>
  <div id="list"></div>
</main>

<dialog id="scanDialog">
  <div class="modal">
    <h2 id="scanHeading">Scan Mail</h2>
    <p class="small">Scanning this item marks it as <b>ARRIVED</b>. Mail entered through the Digest stays <b>NOT ARRIVED</b> until it is scanned.</p><p class="small" style="margin-top:8px">Note: iPhone Silent Mode can suppress webpage sounds. A normal webpage cannot override the hardware Silent Mode switch.</p>
    <label class="fileButton">
      📷 Scan / Take Photo
      <input id="camera" type="file" accept="image/*" capture="environment">
    </label>
    <div id="scanPreview"></div>
    <button class="secondary close" id="cancelScan">Cancel</button>
  </div>
</dialog>

<dialog id="digestDialog">
  <div class="modal">
    <h2>Mail Digest</h2>
    <div id="digestList"></div>
    <button class="primary close" id="addDigest">＋ Add Mail from Digest</button>
    <button class="secondary close" id="closeDigest">Done</button>
  </div>
</dialog>

<script>
const KEY="mail-scanner-mobile-v2";
let items;
try{items=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){items=null}
if(!Array.isArray(items))items=[];
let selected=null;


function scanBeep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const ctx=new C();

    const playTone=(frequency, volume)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      const now=ctx.currentTime;

      osc.type="sine";
      osc.frequency.setValueAtTime(frequency,now);

      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(volume,now+0.015);
      gain.gain.setValueAtTime(volume,now+0.34);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+0.48);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now+0.5);
    };

    const start=()=>{
      // Stronger synthesized delivery-scanner-style confirmation tone.
      playTone(950,0.55);
      playTone(1900,0.12);
    };

    if(ctx.state==="suspended"){
      ctx.resume().then(start).catch(()=>{});
    }else{
      start();
    }

    setTimeout(()=>ctx.close(),650);
  }catch(e){}
}

const $=id=>document.getElementById(id);
const scanDialog=$("scanDialog"),digestDialog=$("digestDialog");

function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const list=$("list");
 if(!items.length){list.innerHTML='<div class="empty">No mail items yet.<br>Tap <b>＋ Add Mail</b> to begin.</div>';return}
 list.innerHTML=items.map(x=>`
 <section class="card">
  <div class="row">
   <div class="icon">${x.arrived?"✉️":"📨"}</div>
   <div class="grow"><div class="name">${esc(x.name)}</div><div class="status ${x.arrived?"arrived":"not"}">${x.arrived?"ARRIVED":"NOT ARRIVED"}</div></div>
  </div>
  ${x.image?`<img class="preview" src="${x.image}" alt="Scanned ${esc(x.name)}">`:""}
  ${x.text?`<textarea data-text="${x.id}" placeholder="Notes / OCR text">${esc(x.text)}</textarea>`:""}
  <div class="actions">
   <button class="primary" data-scan="${x.id}">📷 ${x.image?"Scan Again":"Scan Mail"}</button>
   ${x.image?`<button class="secondary" data-arrive="${x.id}">${x.arrived?"Mark Not Arrived":"Mark Arrived"}</button>`:""}
  </div>
  <button class="danger" style="width:100%;margin-top:8px" data-delete="${x.id}">Delete</button>
 </section>`).join("");
 document.querySelectorAll("[data-scan]").forEach(b=>b.onclick=()=>openScanner(b.dataset.scan));
 document.querySelectorAll("[data-arrive]").forEach(b=>b.onclick=()=>toggleArrived(b.dataset.arrive));
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete));
 document.querySelectorAll("[data-text]").forEach(t=>t.onchange=()=>{let x=items.find(i=>i.id===t.dataset.text);if(x){x.text=t.value;save()}});
}
function addMail(){
 const n=items.length+1;
 items.push({id:crypto.randomUUID(),name:"Mail "+n,arrived:false,image:"",text:""});
 save();
}
function deleteItem(id){if(confirm("Delete this mail item?")){items=items.filter(x=>x.id!==id);save()}}
function toggleArrived(id){const x=items.find(i=>i.id===id);if(x){x.arrived=!x.arrived;save()}}
function openScanner(id){
 selected=id;
 const x=items.find(i=>i.id===id);
 $("scanHeading").textContent="Scan "+x.name;
 $("scanPreview").innerHTML="";
 $("camera").value="";
 scanDialog.showModal();
}
$("camera").addEventListener("change",()=>{
 const file=$("camera").files&&$("camera").files[0];
 if(!file||!selected)return;
 const reader=new FileReader();
 reader.onload=e=>{
  const x=items.find(i=>i.id===selected);
  if(x){x.image=e.target.result;x.arrived=true;save();scanBeep()}
  scanDialog.close();selected=null;
 };
 reader.readAsDataURL(file);
});
$("addBtn").onclick=addMail;
$("digestBtn").onclick=()=>{
 $("digestList").innerHTML=items.length?items.map(x=>`
 <div class="card">
  <div class="row"><b>${esc(x.name)}</b><span class="grow"></span><span class="status ${x.arrived?"arrived":"not"}">${x.arrived?"ARRIVED":"NOT ARRIVED"}</span></div>
 </div>`).join(""):'<div class="empty">No mail items.</div>';
 digestDialog.showModal();
};
$("cancelScan").onclick=()=>scanDialog.close();
$("closeDigest").onclick=()=>digestDialog.close();
$("addDigest").onclick=()=>{
  const name=prompt("Enter the mail item from the digest:");
  if(!name || !name.trim())return;
  items.push({id:crypto.randomUUID(),name:name.trim(),arrived:false,image:"",text:""});
  save();
  $("digestBtn").click();
};
render();
</script>
</body>
</html>
